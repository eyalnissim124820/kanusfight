<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#07060a" />
    <title>Kanu's Fight</title>
    <style>
      html, body { margin: 0; height: 100%; background: #07060a; overflow: hidden; touch-action: none; -webkit-text-size-adjust: 100%; }
      * { -webkit-tap-highlight-color: transparent; }
      body { display: flex; align-items: center; justify-content: center; }
      canvas { display: block; image-rendering: auto; box-shadow: 0 0 40px #000; }
      body.touch { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
      /* phones held upright: game on top, controls underneath */
      @media (orientation: portrait) { body.touch { align-items: flex-start; padding-top: env(safe-area-inset-top, 0px); } }
    </style>
  </head>
  <body>
    <canvas id="game" width="960" height="540"></canvas>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
